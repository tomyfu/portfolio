<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AiFX 관제실</title><style>
*{box-sizing:border-box}body{margin:0;background:#090d11;color:#e5eaed;font:15px system-ui}header,main{max-width:1400px;margin:auto;padding:14px}header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:1px solid #34414b}header strong{font:26px Georgia;color:#e5c693}small{color:#aebbc5}button{background:#151e25;color:inherit;border:1px solid #52636f;border-radius:6px;padding:10px;cursor:pointer;font:inherit}button[aria-pressed=true]{border-color:#68f3e4;color:#68f3e4}main{display:grid;grid-template-columns:2fr 1fr;gap:12px}.map{aspect-ratio:915/737;position:relative;background:center/contain no-repeat url(../assets/aifx-market.jpg)}.pin{position:absolute;transform:translate(-50%,-50%);background:#10171e;min-width:19%;padding:4px;font-size:clamp(9px,2vw,18px);line-height:1.15}.buy{color:#68f3e4}.sell{color:#ff8d8d}.wait{color:#f2ce8b}section,aside{background:#10171e;border:1px solid #354550;padding:14px}section{grid-column:1/-1}h2{margin:0 0 10px}p{line-height:1.55}svg{width:100%;background:#090e13;border-radius:4px}input{width:100%}[hidden]{display:none!important}@media(max-width:720px){main{grid-template-columns:1fr}.pin{min-width:21%}}
</style><header><a href="../projects/aifx.html" style="color:#d6dce2;text-decoration:underline;font-size:14px">← 작업 소개</a><strong>AiFX</strong><span>ANONYMOUS FINANCE</span><small>예시 시세 · MT5 미연결</small><button data-tab="live">시장 관제</button><button data-tab="log">신호 기록</button><button data-tab="stats">전략 검증</button></header><main>
<div class="map" id="map" aria-label="종목별 시장 지도"></div><aside id="detail"></aside>
<section id="live"><button id="step">다음 5분봉</button> <button id="play">자동 재생</button> <button id="reset">처음부터</button><p id="clock"></p><label>리플레이 <input id="seek" type="range" min="0" max="5" value="0"></label><p id="notice" aria-live="polite"></p></section>
<section id="log" hidden></section><section id="stats" hidden></section></main><script>
const items=[['EUR/USD',27,32,'상승 추세','BUY'],['GBP/USD',78,32,'박스권','WAIT'],['USD/JPY',55,51,'횡보','WAIT'],['AUD/USD',27,71,'하락 추세','SELL'],['XAU/USD',79,72,'전환 감시','WAIT']];
const quotes=[1.26510,1.26548,1.26585,1.26610,1.26700,1.26825];
const events=['박스 하단 접근','지지선 회복','M5 반등봉 마감 · BUY','진입 구간 상단 접근','진입 구간 이탈','목표 도달'];
let tick=0,sel=1,timer=null,armed=false;
const el=id=>document.getElementById(id);
const time=i=>new Date(Date.UTC(2026,0,1,9,30+i*5)).toISOString().slice(11,16);
const signal=i=>i===1&&tick>=2&&tick<=3?'BUY':items[i][4];
function render(){
el('map').innerHTML=items.map(([name,x,y],i)=>`<button class="pin ${signal(i).toLowerCase()}" style="left:${x}%;top:${y}%" aria-pressed="${i===sel}" data-pin="${i}">${name}<br>${signal(i)}</button>`).join('');
const [name,,,regime]=items[sel], sig=signal(sel), gb=sel===1;
let detail=gb?(tick<2?'박스 하단 접근 확인<br>'+ (tick?'지지선 회복 확인<br>':'지지선 회복 대기<br>')+'M5 반등봉 마감 대기':tick<=3?'지지선 회복 · M5 반등 확인<br>진입 구간 유효':tick===4?'진입 구간 이탈 · 신규 신호 WAIT':'목표 도달 · 신호 종료'):'지도 탐색용 예시 상태';
const points=quotes.slice(0,tick+1).map((q,i)=>[14+i*58,104-(q-1.265)*25000]);
el('detail').innerHTML=`<h2>${name} <span class="${sig.toLowerCase()}">${sig}</span></h2><small>${regime}</small><p>${detail}</p>`+(gb?`<svg viewBox="0 0 320 122" aria-label="GBP/USD 예시 시세"><path d="M0 106H320 M0 22H320" stroke="#52636f" stroke-dasharray="5 4"/><polyline points="${points.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#68f3e4" stroke-width="3"/><circle cx="${points.at(-1)[0]}" cy="${points.at(-1)[1]}" r="4" fill="#68f3e4"/></svg><p>현재가 ${quotes[tick].toFixed(5)}</p>`+(tick>=2?'<p>진입 1.26585–1.26620<br>손절 1.26465 · 목표 1.26825</p>':'')+`<button id="alert" aria-pressed="${armed}">${armed?'데모 알림 켜짐':'조건 충족 시 알림'}</button>`:'');
el('clock').textContent=time(tick)+' · GBP/USD · '+events[tick];
el('seek').value=tick;
el('log').innerHTML='<h2>GBP/USD 신호 기록</h2>'+events.slice(0,tick+1).map((v,i)=>`<p>${time(i)} · ${v}</p>`).reverse().join('');
el('stats').innerHTML='<h2>예시 시나리오 결과</h2><p>발행 '+Number(tick>=2)+'건 · 목표 도달 '+Number(tick===5)+'건 · 손절 0건</p><small>단일 재생 사례 · 백테스트 성과 미산출</small>';
}
function go(next,notify=false){if(notify&&armed&&tick<2&&next===2)el('notice').textContent='09:40 · GBP/USD BUY · M5 반등 확인';tick=next;render()}
function stop(){clearInterval(timer);timer=null;el('play').textContent='자동 재생'}
document.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.pin!==undefined){sel=Number(b.dataset.pin);render()}if(b.dataset.tab){for(const id of ['live','log','stats'])el(id).hidden=id!==b.dataset.tab}if(b.id==='alert'){armed=!armed;render()}if(b.id==='step'){stop();go(Math.min(5,tick+1),true)}if(b.id==='reset'){stop();el('notice').textContent='';go(0)}if(b.id==='play'){if(timer){stop();return}if(tick===5)go(0);b.textContent='일시정지';timer=setInterval(()=>{go(tick+1,true);if(tick===5)stop()},1300)}};
el('seek').oninput=e=>{stop();el('notice').textContent='';go(Number(e.target.value))};render();
</script></html>
